name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        racket-version: ['9.3']

    steps:
      - uses: actions/checkout@v7

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: ${{ matrix.racket-version }}

      - name: Install Linux build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            libwebkit2gtk-4.1-dev \
            linuxptp \
            ethtool \
            iproute2 \
            libcap2-bin \
            desktop-file-utils

      - name: Install pinned Glaze dependency
        shell: bash
        run: bash scripts/install-glaze.sh

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          node --check public/js/chart.js
          node --check public/js/app.js
          node --check public/js/role-consistency.js
          node --check public/js/reference-controls.js
          node --check public/js/ux.js
          node --check public/js/tools.js
          node --check public/js/packet-analysis.js
          node --check public/js/timing-evidence.js
          node --check public/js/timing-evidence-ui.js
          node --check public/js/bmca-timeline.js
          node --check public/js/bmca-timeline-ui.js
          node --check public/js/readiness-tools.js
          node --check public/js/session-controls.js
          node --check public/js/capture-quality.js
          node --check public/js/qualification.js
          node tests/timing-evidence-test.js
          node tests/bmca-timeline-test.js
          test -f public/css/app.css
          test -f public/css/ux.css
          test -f public/css/packet-analysis.css
          test -f public/css/readiness.css

      - name: Check release scripts and metadata gate
        shell: bash
        run: |
          bash -n scripts/check-release-version.sh
          bash -n scripts/install-glaze.sh
          bash -n scripts/package-linux.sh
          bash -n scripts/package-deb.sh
          test "$(tr -d '[:space:]' < GLAZE_REVISION)" = \
            "$(git -C "$HOME/glaze-src" rev-parse HEAD)"
          bash scripts/check-release-version.sh v1.0.0

      - name: Compile
        run: raco make main.rkt

      - name: Run tests
        run: raco test tests/

      - name: Headless selfcheck
        run: racket main.rkt --selfcheck

      - name: Headless doctor
        shell: bash
        run: |
          racket main.rkt --doctor-json > "$RUNNER_TEMP/gptp-doctor.json"
          python3 - "$RUNNER_TEMP/gptp-doctor.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              report = json.load(f)
          assert report["schema_version"] == 1
          assert report["product"] == "gPTP Studio"
          assert report["platform"] == "linux"
          assert report["privacy"]["network_identifiers_redacted"] is True
          assert report["privacy"]["host_identifiers_redacted"] is True
          host = report["host"]
          assert host["fingerprint_schema_version"] == 1
          assert isinstance(host["distro"]["pretty_name"], str)
          assert isinstance(host["kernel"]["release"], str)
          assert isinstance(host["kernel"]["architecture"], str)
          assert isinstance(host["system"]["clocksource"], str)
          assert host["privacy"]["hostname_omitted"] is True
          assert host["privacy"]["machine_id_omitted"] is True
          assert host["privacy"]["hardware_serials_omitted"] is True
          quality = report["host_quality"]
          assert quality["schema_version"] == 1
          assert quality["status"] in ("context", "attention")
          assert quality["accuracy_claim"] == "not-calibrated"
          assert isinstance(quality["checks"], list)
          assert all(c["state"] in ("info", "warn") for c in quality["checks"])
          assert isinstance(report["interfaces"], list)
          for entry in report["interfaces"]:
              nic = entry["nic"]
              assert "mac" not in nic and "ips" not in nic
              assert "driver_version" in nic
              assert "firmware_version" in nic
              assert "bus_info" in nic
              assert "phc_clock_name" in nic
          assert report["accuracy_claim"] == "not-calibrated"
          PY

      - name: Smoke Linux tarball and Debian package
        shell: bash
        run: |
          GPTP_STUDIO_SELFCHECK_PORT=18741 \
          GPTP_STUDIO_DEB_SELFCHECK_PORT=18742 \
            bash scripts/package-deb.sh 1.0.0 v1.0.0-ci

      - name: Install, validate and remove Debian package
        shell: bash
        run: |
          set -euo pipefail
          DEB="gPTP-Studio-v1.0.0-ci-linux-amd64.deb"
          test -s "$DEB"
          sudo apt-get install -y "./$DEB"
          test "$(gptp-studio --version)" = "1.0.0"
          desktop-file-validate /usr/share/applications/gptp-studio.desktop
          gptp-studio --doctor-json > "$RUNNER_TEMP/gptp-installed-doctor.json"
          python3 - "$RUNNER_TEMP/gptp-installed-doctor.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              report = json.load(f)
          assert report["product"] == "gPTP Studio"
          assert report["platform"] == "linux"
          assert report["privacy"]["network_identifiers_redacted"] is True
          assert report["host_quality"]["accuracy_claim"] == "not-calibrated"
          PY
          mkdir -p "$HOME/.gptp-studio"
          printf 'preserve\n' > "$HOME/.gptp-studio/ci-user-data"
          sudo apt-get remove -y gptp-studio
          test ! -e /usr/bin/gptp-studio
          test -f "$HOME/.gptp-studio/ci-user-data"
