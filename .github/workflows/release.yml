name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag and app version alignment
        shell: bash
        run: |
          bash -n scripts/check-release-version.sh
          bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

  linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@main

      - name: Install engine and host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            linuxptp \
            ethtool \
            iproute2 \
            libcap2-bin \
            desktop-file-utils \
            libgtk-4-dev \
            libglib2.0-dev \
            libsecret-1-dev \
            at-spi2-core \
            libncurses-dev \
            zlib1g-dev \
            liblz4-dev \
            file

      - name: Install Rivet (released package)
        run: raco pkg install --auto --no-docs --ignore-checksums https://github.com/turinglambdaai/rivet.git

      # --without-updates: the 1.0.0 first release has no installed base to
      # serve an update feed to; the RivetUpdate channel (keys + manifest)
      # starts with 1.0.1. --development matches the family precedent of
      # running the full package + smoke + installer flow without production
      # platform signing.
      - name: Build, package, and verify the release
        run: |
          raco rivet generate
          raco rivet release --development --without-updates

      - name: Install and smoke the deb (doctor path)
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          deb=$(find dist -name '*.deb' | head -1)
          test -n "$deb"
          sudo apt-get install -y "./$deb"
          # Family deb contract: payload under /opt/<name>, desktop entry
          # for GUI launch; the headless surface runs from the install root.
          test -x /opt/gptp-studio/gptp-studio
          /opt/gptp-studio/gptp-studio --doctor > doctor.out
          test "$?" = "0"
          head -5 doctor.out

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-out
          find dist -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' \
               -o -name 'SHA256SUMS*' -o -name '*sbom*' -o -name '*notices*' \) \
            -exec cp {} release-out/ \;
          ls -la release-out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gptp-studio-linux-${{ matrix.arch }}
          path: release-out/

  publish:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
