name: CI

on:
  push:
    branches: [main, rivet-migration]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        racket-version: ['9.3']

    steps:
      - uses: actions/checkout@v7

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: ${{ matrix.racket-version }}
          distribution: full
          variant: CS
          architecture: x64

      - name: Install engine and host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            linuxptp \
            ethtool \
            iproute2 \
            libcap2-bin \
            desktop-file-utils \
            libgtk-4-dev \
            libsecret-1-dev \
            at-spi2-core \
            libncurses-dev \
            zlib1g-dev \
            liblz4-dev \
            file

      - name: Install Rivet (released package)
        run: raco pkg install --auto --no-docs https://github.com/turinglambdaai/rivet.git

      - name: Backend tests
        run: raco test tests/*.rkt

      - name: Build the GTK4 host against the platform library
        run: raco rivet build

      - name: Generate and stage the typed clients
        run: |
          raco rivet generate
          test -s linux/GeneratedBackend.hpp
