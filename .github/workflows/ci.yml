name: CI

on:
  push:
    branches: [main, rivet-migration]
  pull_request:
    branches: [main]

# A new push to the same ref supersedes the queued run; in-flight runs on
# main are never cancelled mid-release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7

      # The GTK4 host embeds Racket CS; no Linux distribution ships the
      # static libracketcs plus boot layout the embedder needs, so the
      # runner uses Rivet's checksum-pinned embeddable runtime build.
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@v0.12.0

      - name: Install engine and host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            linuxptp \
            ethtool \
            iproute2 \
            libcap2-bin \
            desktop-file-utils \
            libgtk-4-dev \
            libglib2.0-dev \
            libsecret-1-dev \
            at-spi2-core \
            libncurses-dev \
            zlib1g-dev \
            liblz4-dev \
            file

      - name: Install Rivet (released package)
        run: raco pkg install --auto --no-docs --ignore-checksums https://github.com/turinglambdaai/rivet.git

      - name: Install Permit (entitlement verification)
        run: raco pkg install --auto --no-docs --ignore-checksums https://github.com/turinglambdaai/permit.git

      - name: Backend tests
        run: raco test tests/*.rkt

      - name: Build the GTK4 host against the platform library
        run: raco rivet build

      - name: Generate and stage the typed clients
        run: |
          raco rivet generate
          test -s linux/GeneratedBackend.hpp
