name: CI

on:
  push:
    branches: [main, rivet-migration]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7

      # The GTK4 host embeds Racket CS; no Linux distribution ships the
      # static libracketcs plus boot layout the embedder needs, so the
      # runner uses Rivet's checksum-pinned embeddable runtime build.
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@main

      - name: Install engine and host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            linuxptp \
            ethtool \
            iproute2 \
            libcap2-bin \
            desktop-file-utils \
            libgtk-4-dev \
            libglib2.0-dev \
            libsecret-1-dev \
            at-spi2-core \
            libncurses-dev \
            zlib1g-dev \
            liblz4-dev \
            file

      - name: Install Rivet (released package)
        run: raco pkg install --auto --no-docs --ignore-checksums https://github.com/turinglambdaai/rivet.git

      - name: Install Permit (pinned)
        run: raco pkg install --auto --no-docs --ignore-checksums --name permit https://github.com/turinglambdaai/permit/archive/ccb7bb3fd69a271406ed3e5e79c52ee239d08486.zip

      - name: Compile entitlement tooling
        run: raco make app/gate.rkt scripts/issue-license.rkt

      - name: Smoke manual Permit issuance
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/permit-smoke"
          mkdir -p "$d"
          raco permit keygen \
            --private "$d/private.der" \
            --public "$d/public.der" \
            --trust-store "$d/trust.json" \
            --key-id ci-entitlement \
            --issuer site.jrtx.gptpstudio
          racket scripts/issue-license.rkt \
            --key "$d/private.der" \
            --trust-store "$d/trust.json" \
            --key-id ci-entitlement \
            --subject ci@example.com \
            --subject-id cus_ci \
            --updates-through 2027-10-15T23:59:59Z \
            --out "$d/ci.license"
          raco permit verify \
            --trust-store "$d/trust.json" \
            --credential "$d/ci.license"

      - name: Backend tests
        run: raco test tests/*.rkt

      - name: Build the GTK4 host against the platform library
        run: raco rivet build

      - name: Generate and stage the typed clients
        run: |
          raco rivet generate
          test -s linux/GeneratedBackend.hpp
