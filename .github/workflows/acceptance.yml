name: Product Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Preserve every main and manual acceptance run; only superseded PR checks
# are cancelled. This keeps release quality gates intact under rapid pushes.
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RIVET_PIN: 9d766b4acab672844093204cb4845ef4ef933d2c
jobs:
  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@9d766b4acab672844093204cb4845ef4ef933d2c
      - name: Install native and pinned Racket dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes at-spi2-core dbus-x11 libgtk-4-dev \
            libglib2.0-dev libsecret-1-dev libpcap-dev linuxptp ethtool \
            iproute2 libcap2-bin python3-pyatspi weston
          raco pkg install --auto --no-docs \
            "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
          raco pkg install --auto --no-docs --ignore-checksums \
            https://github.com/turlamai/permit.git
      - name: Run executable acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rivet/acceptance
          dbus-run-session -- bash -c \
            'set -euo pipefail; raco rivet acceptance --json | tee .rivet/acceptance/report.json'
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gptp-studio-acceptance-linux
          path: .rivet/acceptance
          if-no-files-found: warn
