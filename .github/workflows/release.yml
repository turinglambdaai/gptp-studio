name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# A tag-push event can be delivered twice (v0.3.1 shipped through that
# race: two builds, interleaved asset/feed writes, and a signed feed
# that referenced bytes the release no longer carried). Serialize the
# runs on the tag so the last complete run is the single writer of both
# the assets and the feed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Single source of truth for the release rivet pin ("发布构建切 pin");
# every raco pkg install below references this so a bump is one edit.
# The setup-embed-racket action refs stay hardcoded: GitHub does not
# expand env in `uses:`.
env:
  RIVET_PIN: 9d766b4acab672844093204cb4845ef4ef933d2c

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag and app version alignment
        shell: bash
        run: |
          bash -n scripts/check-release-version.sh
          bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

  linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@9d766b4acab672844093204cb4845ef4ef933d2c

      - name: Install engine, host build, and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            linuxptp \
            ethtool \
            iproute2 \
            libcap2-bin \
            desktop-file-utils \
            rpm \
            libgtk-4-dev \
            libglib2.0-dev \
            libsecret-1-dev \
            at-spi2-core \
            libncurses-dev \
            zlib1g-dev \
            liblz4-dev \
            file

      - name: Install Rivet (pinned release package)
        run: raco pkg install --auto --no-docs --ignore-checksums "https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}"

      - name: Install Permit (entitlement gate dependency)
        run: raco pkg install --auto --no-docs --ignore-checksums https://github.com/turlamai/permit.git

      # --development matches the family precedent of running the full
      # package + smoke + installer flow without production platform
      # signing. The signed update feed is built centrally in the publish
      # job (scripts/make-update-manifest.rkt under the
      # UPDATER_PRIVATE_KEY secret), so the per-runner release keeps
      # rivet's internal manifest off. linux-formats in rivet.rktd makes
      # this produce deb + rpm + AppImage alongside the tar.gz and zip;
      # APPIMAGE_EXTRACT_AND_RUN lets rivet's appimagetool run on the
      # FUSE-less runner.
      - name: Build, package, and verify the release
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          raco rivet generate
          raco rivet release --development --without-updates

      - name: Install and smoke the deb (doctor path)
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          deb=$(find dist -name '*.deb' | head -1)
          test -n "$deb"
          sudo apt-get install -y "./$deb"
          # Family deb contract: payload under /opt/<name>, desktop entry
          # for GUI launch; the headless surface runs from the install root.
          test -x /opt/gptp-studio/gptp-studio
          /opt/gptp-studio/gptp-studio --doctor > doctor.out
          test "$?" = "0"
          head -5 doctor.out

      # Every distributable gets a .sha256 sidecar next to its body, the
      # SBOM carries the version and arch in its name, and the publish job
      # folds the sidecars into one SHA256SUMS.
      - name: Collect, name, and checksum the release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          mkdir -p release-out
          find dist -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' \
               -o -name '*.rpm' -o -name '*.AppImage' -o -name 'sbom.cdx.json' \) \
            -exec cp {} release-out/ \;
          cd release-out
          mv sbom.cdx.json "gptp-studio-${VERSION}-linux-${ARCH}.sbom.cdx.json"
          for f in *; do
            case "$f" in
              *.sha256) ;;
              *) sha256sum "$f" > "$f.sha256" ;;
            esac
          done
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gptp-studio-linux-${{ matrix.arch }}
          path: release-out/

  publish:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@9d766b4acab672844093204cb4845ef4ef933d2c
      - name: Install Rivet (pinned release package)
        run: raco pkg install --auto --no-docs --ignore-checksums "https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}"

      - name: Install Permit (entitlement gate dependency)
        run: raco pkg install --auto --no-docs --ignore-checksums https://github.com/turlamai/permit.git
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Aggregate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          # Two-space text form (no binary-mode "*" rows).
          cat *.sha256 | sed 's/ \*/  /' > SHA256SUMS
          sha256sum --check --quiet SHA256SUMS

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      # The signed feed (update-stable.json on main) is what makes older
      # installs check: raw.githubusercontent serves it, the artifacts are
      # reached through the releases/latest/download aliases, and the
      # commit is the last release step ("feed: x.y.z"). The private key
      # exists only as the UPDATER_PRIVATE_KEY secret + the operator's
      # vault; --verify-public-key re-verifies the written feed against the
      # shipped anchor before anything is committed.
      - name: Sign the update feed and commit it to main
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "${UPDATER_PRIVATE_KEY:-}" || {
            echo "::error::UPDATER_PRIVATE_KEY is not set — refusing to release without a signed feed"; exit 1; }
          for f in \
            "gptp-studio-$VERSION-linux-amd64.deb" \
            "gptp-studio-$VERSION-linux-x64.tar.gz" \
            "gptp-studio-$VERSION-linux-arm64.deb" \
            "gptp-studio-$VERSION-linux-arm64.tar.gz"; do
            test -f "artifacts/$f" || {
              echo "::error::missing feed artifact artifacts/$f"; exit 1; }
          done
          KEY_PEM="$RUNNER_TEMP/updater-signing-key.pem"
          printf '%s\n' "$UPDATER_PRIVATE_KEY" > "$KEY_PEM"
          racket scripts/make-update-manifest.rkt \
            --version "$VERSION" \
            --deb "artifacts/gptp-studio-$VERSION-linux-amd64.deb" \
            --tarball "artifacts/gptp-studio-$VERSION-linux-x64.tar.gz" \
            --deb-arm64 "artifacts/gptp-studio-$VERSION-linux-arm64.deb" \
            --tarball-arm64 "artifacts/gptp-studio-$VERSION-linux-arm64.tar.gz" \
            --private-key "$KEY_PEM" \
            --verify-public-key app/keys/updater/public.pem \
            --out update-stable.json
          rm -f "$KEY_PEM"
          git config user.name "gptp-studio feed bot"
          git config user.email "actions@turinglambdaai.github.io"
          git add update-stable.json
          git commit -m "feed: $VERSION [skip ci]"
          # The checkout is detached at the tag; rebase the feed commit
          # onto current main so anything that landed on main while the
          # release built (a concurrent push, a serialized duplicate run)
          # cannot reject the release's final step.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      # Family rule: download buttons point at
      # releases/latest/download/<name>, so every release also ships
      # versionless stable-alias copies of the primary installers
      # (overwritten on each release; the versioned assets stay
      # canonical). The AppImage aliases follow the taskly benchmark.
      - name: Stable alias copies (versionless direct-download links)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p stable-alias
          cp "artifacts/gptp-studio-$VERSION-linux-amd64.deb" stable-alias/gptp-studio-linux-amd64.deb
          cp "artifacts/gptp-studio-$VERSION-linux-arm64.deb" stable-alias/gptp-studio-linux-arm64.deb
          cp "artifacts/gptp-studio-$VERSION-linux-x64.tar.gz" stable-alias/gptp-studio-linux-x64.tar.gz
          cp "artifacts/gptp-studio-$VERSION-linux-arm64.tar.gz" stable-alias/gptp-studio-linux-arm64.tar.gz
          cp "artifacts/gptp-studio-$VERSION-linux-x86_64.AppImage" stable-alias/gptp-studio-linux-x64.AppImage
          cp "artifacts/gptp-studio-$VERSION-linux-aarch64.AppImage" stable-alias/gptp-studio-linux-arm64.AppImage
          gh release upload "$GITHUB_REF_NAME" stable-alias/* --clobber -R "$GITHUB_REPOSITORY"
