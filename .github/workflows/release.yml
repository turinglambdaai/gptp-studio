name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag, app version, changelog and pinned dependencies
        shell: bash
        run: |
          bash -n scripts/check-release-version.sh
          bash -n scripts/install-glaze.sh
          test "$(tr -d '[:space:]' < GLAZE_REVISION)" != ""
          bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

  linux:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          distribution: full
      - name: Install build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            libwebkit2gtk-4.1-dev \
            linuxptp \
            ethtool \
            iproute2 \
            libcap2-bin
      - name: Install pinned Glaze
        shell: bash
        run: bash scripts/install-glaze.sh
      - name: Build and smoke-test Linux tarball + Debian package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(tr -d '[:space:]' < GLAZE_REVISION)" = \
            "$(git -C "$HOME/glaze-src" rev-parse HEAD)"
          raco make main.rkt
          bash scripts/package-deb.sh "$VERSION" "$GITHUB_REF_NAME"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            gPTP-Studio-*-linux-x64.tar.gz
            gPTP-Studio-*-linux-x64.tar.gz.sha256
            gPTP-Studio-*-linux-amd64.deb
            gPTP-Studio-*-linux-amd64.deb.sha256

  publish:
    needs: [linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-packages/*
          generate_release_notes: true
